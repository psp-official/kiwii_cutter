name: Build Kiwii Cutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Generate Android Shell and Configure Permissions
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp lib/main.dart /tmp/main.dart
          flutter create --platforms=android --org com.lossless.cutter .
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/main.dart lib/main.dart

          # FFmpegKit အတွက် minSdkVersion ကို 24 သို့ မြှင့်တင်ခြင်း
          sed -i 's/minSdkVersion .*/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle || true

          # Android Gallery သိမ်းဆည်းခွင့် Permissions ထည့်သွင်းခြင်း
          sed -i '/<application/i <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" tools:replace="android:maxSdkVersion"/>\n<uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<manifest /<manifest xmlns:tools="http:\/\/schemas.android.com\/tools" /g' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies & Build Release APK
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lossless-Cutter-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
